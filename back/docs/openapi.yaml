        - fechaHoraFin
      properties:
        idResena:
          type: integer
          format: int64
        idViaje:
          type: integer
          format: int64
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: [string, "null"]
          maxLength: 500
        idLanchero:
          type: integer
          format: int64
        nombreLanchero:
          type: string
        fecha:
          type: string
          format: date-time
        turistaNombreCompleto:
          type: string
        zonaOrigen:
          type: string
        zonaDestino:
          type: string
        fechaHoraInicio:
          type: string
          format: date-time
        fechaHoraFin:
          type: [string, "null"]
          format: date-time
    LancheroRegistro:
      type: object
      required:
        - nombreCompleto
        - whatsapp
        - correo
        - contrasena
        - nombreEmbarcacion
        - capacidadPasajeros
      properties:
        nombreCompleto:
          type: string
          maxLength: 201
          description: >-
            No puede estar vacío. Tras quitar espacios externos, debe incluir
            nombre y apellido separados por espacio(s); cada parte resultante
            debe tener como máximo 100 caracteres.
          example: Ana Pérez
        whatsapp:
          type: string
          pattern: '^\+?[0-9 ()-]{8,20}$'
          description: >-
            No puede estar vacío. De 8 a 20 caracteres permitidos por el patrón:
            dígitos, espacios, paréntesis y guiones; puede comenzar con `+`.
          example: "+5491123456789"
        correo:
          type: string
          format: email
          maxLength: 100
          description: No puede estar vacío y debe ser único entre lancheros.
          example: ana@example.com
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: No puede estar vacía; no hay otras reglas de composición en el DTO.
          example: ClaveSegura123
        nombreEmbarcacion:
          type: string
          maxLength: 100
          description: No puede estar vacío.
          example: La Aurora
        capacidadPasajeros:
          type: integer
          format: int32
          exclusiveMinimum: 0
          description: Valor obligatorio mayor que cero.
          example: 8
        zonasIds:
          type: array
          uniqueItems: true
          description: IDs existentes y sin duplicados; opcional. Si se omite, la lancha queda sin zonas asociadas.
          items:
            type: integer
            format: int64
            minimum: 1
    RegistroCreado:
      type: object
      additionalProperties: false
      required:
        - idLanchero
        - idLancha
        - estado
        - mensaje
      properties:
        idLanchero:
          type: integer
          format: int64
        idLancha:
          type: integer
          format: int64
        estado:
          type: string
          enum:
            - PENDIENTE
          example: PENDIENTE
        mensaje:
          type: string
          example: Solicitud de registro recibida correctamente.
    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Los datos registrados entran en conflicto con un registro existente.
    ReservaResena:

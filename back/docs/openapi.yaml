        - nombreLanchero
        - fecha
        - turistaNombreCompleto
        - zonaOrigen
        - zonaDestino
        - fechaHoraInicio
        - fechaHoraFin
      properties:
        idResena:
          type: integer
          format: int64
        idViaje:
          type: integer
          format: int64
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: [string, "null"]
          maxLength: 500
        idLanchero:
          type: integer
          format: int64
        nombreLanchero:
          type: string
        fecha:
          type: string
          format: date-time
        turistaNombreCompleto:
          type: string
        zonaOrigen:
          type: string
        zonaDestino:
          type: string
        fechaHoraInicio:
          type: string
          format: date-time
        fechaHoraFin:
          type: [string, "null"]
          format: date-time
    LancheroRegistro:
      type: object
      required:
        - nombreCompleto
        - whatsapp
        - correo
        - nombreEmbarcacion
        - capacidadPasajeros
      properties:
        nombreCompleto:
          type: string
          maxLength: 201
          example: Ana Pérez
        whatsapp:
          type: string
          pattern: '^\+?[0-9 ()-]{8,20}$'
          example: "+5491123456789"
        correo:
          type: string
          format: email
          maxLength: 100
          example: ana@example.com
        nombreEmbarcacion:
          type: string
          maxLength: 100
          example: La Aurora
        capacidadPasajeros:
          type: integer
          format: int32
          exclusiveMinimum: 0
          example: 8
        zonasIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
    RegistroCreado:
      type: object
      additionalProperties: false
      required:
        - idLanchero
        - idLancha
        - estado
        - mensaje
      properties:
        idLanchero:
          type: integer
          format: int64
        idLancha:
          type: integer
          format: int64
        estado:
          type: string
          enum:
            - PENDIENTE
          example: PENDIENTE
        mensaje:
          type: string
          example: Solicitud de registro recibida correctamente.
    Error:
      type: object
      required: [status, error, message, path, timestamp]
      properties:
        status:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: Los datos registrados entran en conflicto con un registro existente.
        path:
          type: string
          example: /lancheros/registrar
        timestamp:
          type: string
          format: date-time

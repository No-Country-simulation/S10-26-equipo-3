
spring.application.name=nautiflow

# Swagger
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/delta_tigre_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Multipart
spring.servlet.multipart.max-file-size=${R2_MAX_MULTIPART_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=100MB

# Cloudflare R2
nautiflow.r2.endpoint=${NAUTIFLOW_R2_ENDPOINT:https://8fce54101fd9f8a6ebb2c17ffe02ce6c.r2.cloudflarestorage.com}
nautiflow.r2.access-key-id=${NAUTIFLOW_R2_ACCESS_KEY_ID:}
nautiflow.r2.secret-access-key=${NAUTIFLOW_R2_SECRET_ACCESS_KEY:}
nautiflow.r2.bucket=deltabucket
nautiflow.r2.region=auto

# Storage limits
nautiflow.storage.max-document-bytes=${R2_MAX_DOCUMENT_BYTES:15728640}
nautiflow.storage.max-photo-bytes=${R2_MAX_PHOTO_BYTES:10485760}
nautiflow.storage.presigned-url-minutes=${R2_PRESIGNED_URL_MINUTES:15}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# SMTP authentication
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

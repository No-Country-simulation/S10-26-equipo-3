
spring.application.name=nautiflow

# Swagger
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/delta_tigre_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# HikariCP
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/registro-email-outbox.sql

# Firma de tokens JWT (configurar con una clave aleatoria de al menos 256 bits).
nautiflow.jwt.secret=${NAUTIFLOW_JWT_SECRET}

# Multipart
spring.servlet.multipart.max-file-size=${R2_MAX_MULTIPART_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=100MB

# Límite de intentos fallidos de inicio de sesión
nautiflow.security.login.max-intentos=${NAUTIFLOW_LOGIN_MAX_ATTEMPTS:5}
nautiflow.security.login.minutos-ventana=${NAUTIFLOW_LOGIN_WINDOW_MINUTES:15}
nautiflow.security.login.minutos-bloqueo=${NAUTIFLOW_LOGIN_LOCK_MINUTES:15}
# Usa la IP real del cliente cuando la aplicación está detrás de un proxy (por ejemplo, Render).
server.forward-headers-strategy=native

# Cloudflare R2
nautiflow.r2.endpoint=${NAUTIFLOW_R2_ENDPOINT:https://8fce54101fd9f8a6ebb2c17ffe02ce6c.r2.cloudflarestorage.com}
nautiflow.r2.access-key-id=${NAUTIFLOW_R2_ACCESS_KEY_ID:}
nautiflow.r2.secret-access-key=${NAUTIFLOW_R2_SECRET_ACCESS_KEY:}
nautiflow.r2.bucket=deltabucket
nautiflow.r2.region=auto

# Storage limits
nautiflow.storage.max-document-bytes=${R2_MAX_DOCUMENT_BYTES:15728640}
nautiflow.storage.max-photo-bytes=${R2_MAX_PHOTO_BYTES:10485760}
nautiflow.storage.presigned-url-minutes=${R2_PRESIGNED_URL_MINUTES:15}

# Resend transactional email API
nautiflow.mail.resend.api-key=${RESEND_API_KEY:}
nautiflow.mail.resend.from=${RESEND_FROM:}
# Configure NAUTIFLOW_MAIL_IDEMPOTENCY_NAMESPACE=render in Render; local defaults to local.
nautiflow.mail.idempotency-namespace=${NAUTIFLOW_MAIL_IDEMPOTENCY_NAMESPACE:local}
# Registro de lanchero: reintentos durables de correo
nautiflow.registration.email.poll-interval-ms=${REGISTRO_EMAIL_POLL_INTERVAL_MS:1000}
nautiflow.registration.email.max-attempts=${REGISTRO_EMAIL_MAX_ATTEMPTS:5}

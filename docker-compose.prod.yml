services:
  nautiflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-delta_tigre_db}
    volumes:
      - nautiflow-pgdata:/var/lib/postgresql/data
      - ./back/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./back/init/02-zonas.sql:/docker-entrypoint-initdb.d/02-zonas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  nautiflow-api:
    build: ./back
    restart: unless-stopped
    depends_on:
      nautiflow-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nautiflow-db:5432/${POSTGRES_DB:-delta_tigre_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-delta_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      NAUTIFLOW_JWT_SECRET: ${NAUTIFLOW_JWT_SECRET:?Define NAUTIFLOW_JWT_SECRET}
      NAUTIFLOW_ADMIN_EMAIL: ${NAUTIFLOW_ADMIN_EMAIL:?Define NAUTIFLOW_ADMIN_EMAIL}
      NAUTIFLOW_ADMIN_PASSWORD: ${NAUTIFLOW_ADMIN_PASSWORD:?Define NAUTIFLOW_ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      NAUTIFLOW_R2_ENDPOINT: ${NAUTIFLOW_R2_ENDPOINT:-https://8fce54101fd9f8a6ebb2c17ffe02ce6c.r2.cloudflarestorage.com}
      NAUTIFLOW_R2_BUCKET: ${NAUTIFLOW_R2_BUCKET:-deltabucket}
      NAUTIFLOW_R2_ACCESS_KEY_ID: ${NAUTIFLOW_R2_ACCESS_KEY_ID:-}
      NAUTIFLOW_R2_SECRET_ACCESS_KEY: ${NAUTIFLOW_R2_SECRET_ACCESS_KEY:-}
      NAUTIFLOW_MAIL_IDEMPOTENCY_NAMESPACE: ${NAUTIFLOW_MAIL_IDEMPOTENCY_NAMESPACE:-dokploy}

  nautiflow-web:
    build:
      context: ./front/NautiFlow
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - nautiflow-api

volumes:
  nautiflow-pgdata:
